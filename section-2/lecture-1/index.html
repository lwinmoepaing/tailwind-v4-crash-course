<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind Project</title>
    <link rel="stylesheet" href="output/output.css" />
  </head>
  <body class="p-5">
    <main class="max-w-md mx-auto mt-10 p-6 rounded-xl border">
      <h1 class="text-2xl font-bold text-shadow-sm">Invite your team</h1>
      <p class="mt-2">
        Send an invite, or <a href="#" class="underline">copy the join link</a>.
      </p>

      <input
        type="email"
        placeholder="teammate@company.com"
        class="block w-full mt-4 px-3 py-2 rounded-lg"
      />

      <label class="flex items-center gap-2 mt-3">
        <input type="checkbox" /> Email me when they join
      </label>

      <ul class="mt-4 h-28 overflow-y-scroll divide-y">
        <li class="py-2">Ko Lwin</li>
        <li class="py-2">Ma Ma</li>
        <li class="py-2">Aung Gyi</li>
        <li class="py-2">Kyaw Gyi</li>
        <li class="py-2">Okkar</li>
      </ul>

      <button class="mt-4 px-4 py-2 rounded-lg inline-flex items-center gap-2">
        <svg viewBox="0 0 24 24" class="w-5 h-5">
          <circle cx="12" cy="12" r="10" class="fill-none" stroke-width="1.5" />
          <path d="M7 12l10-4-4 10-1.5-4.5z" />
        </svg>
        Send invite
      </button>
    </main>
  </body>
</html>
