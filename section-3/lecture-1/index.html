<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind Project</title>
    <link rel="stylesheet" href="output/output.css" />
  </head>

  <body class="p-5">
    <!-- Sizing -->
    <section class="space-y-6 mb-6">
      <div>
        <h2>Width</h2>
        <div class="w-1/2 border">
          w-1/2
        </div>
      </div>

      <div>
        <h2>Max Width</h2>
        <div class="max-w-xs border">
          max-w-md
        </div>
      </div>

      <div>
        <h2>Height</h2>
        <div class="h-8 border">
          h-8
        </div>
      </div>

      <div>
        <h2>Size</h2>
        <div class="size-12 border">
          size-12
        </div>
      </div>
    </section>

    <!-- Spacing -->
    <section class="space-y-6">
      <div>
        <h2>Padding</h2>
        <div class="flex flex-col justify-start items-start gap-3">
          <div class="p-6 border">p-6</div>
          <div class="px-5 border">px-5</div>
          <div class="py-2 border">py-2</div>
          <div class="p-3 border">p-3</div>
          <div class="p-1 border">p-1</div>
        </div>
      </div>
      <div>
        <h2>Margin</h2>
        <div class="mx-auto max-w-sm border">mx-auto</div>
        <br />

        <!-- Middle Line -->
        <hr />

        <!-- Margin Bottom -->
        <div class="mb-3 max-w-sm border">mb-3</div>
        <hr />
        <div class="mt-6 max-w-sm border">mt-6</div>

      </div>
      <div>
        <h2>Space Between</h2>
        <div class="space-y-3 border">
          <div>Item 1</div>
          <div>Item 2</div>
          <div>Item 3</div>
        </div>
      </div>
    </section>
  </body>
</html>
